spring:
  application:
    name: eventos-api

  datasource:
    url: jdbc:postgresql://localhost:5432/eventos
    username: eventos
    password: eventos
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  qrcode:
    secret: ${QR_CODE_SECRET:dev-only-secret-change-me}
  reservation:
    hold-duration: 10m
    expiration-sweep-interval-ms: 60000
  jwt:
    # HS256 requires >= 256-bit key
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    expiration: 1h
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY:}
